name: Deploy (Android internal + iOS TestFlight)

on:
  push:
    branches: ['main']
    paths: ['apps/mobile/**']

jobs:
  build_android:
    name: Build Android (internal distribution)
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build iOS (App Store)
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
